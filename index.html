<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio Otávio</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="logo-container">
            <div class="logo-text">Portfólio</div>
            <div class="logo-plus">O</div>
        </div>
        <div class="header-status">
            <div class="status-dot"></div>
            Sistema de Gestão - Otávio
        </div>
    </header>

    <div class="background-container">
        <div id="canvas-container"></div>
    </div>

    <main style="min-height: 100vh; display: flex; align-items: center; justify-content: center; width: 100%;">
        <div class="glass-card" style="width: 90%; max-width: 440px; padding: 3rem; text-align: center;">
            <div class="logo-container" style="justify-content: center; margin-bottom: 1rem;">
                <div class="logo-text">Portfólio</div>
                <div class="logo-plus">O</div>
            </div>
            <h1 class="neon-text" style="font-size: 1.5rem; margin-bottom: 0.5rem; color: #fff; text-shadow: none;">
                BEM-VINDO AO MEU PORTFÓLIO</h1>
            <p
                style="color: var(--text-dim); margin-bottom: 2.5rem; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; font-size: 0.7rem;">
                Explore meus projetos de desenvolvimento de software</p>

            <form id="loginForm">
                <button type="submit" class="btn"
                    style="width: 100%; height: 3.5rem; background: var(--primary); color: #000; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; transition: all 0.3s ease;">
                    Acessar Projeto de Crédito</button>
            </form>

            <div
                style="margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--glass-border); font-size: 0.7rem; color: var(--text-dim);">
                DESENVOLVIDO POR OTÁVIO - 2026
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // Lógica de Entrada para Portfólio
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            // Acesso direto sem senha para o portfólio
            window.location.href = 'dashboard.html';
        });

        // Background Planet Logic (Three.js)
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const geometry = new THREE.SphereGeometry(5, 64, 64);
        const material = new THREE.MeshPhongMaterial({
            color: 0x00ff88,
            wireframe: true,
            transparent: true,
            opacity: 0.2
        });
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);

        const light = new THREE.PointLight(0xffffff, 1, 100);
        light.position.set(10, 10, 10);
        scene.add(light);

        camera.position.z = 15;

        function animate() {
            requestAnimationFrame(animate);
            sphere.rotation.y += 0.002;
            sphere.rotation.x += 0.001;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
