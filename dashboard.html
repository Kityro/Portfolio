<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Mais | Crédito</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo-container" style="margin-bottom: 0;">
            <div class="logo-text">mundo</div>
            <div class="logo-plus">+</div>
        </div>
        <div class="header-status">
            <div class="status-dot"></div>
            Real-time Credit Assessment Active
        </div>
    </header>

    <div class="background-container">
        <div id="canvas-container"></div>
    </div>

    <div class="glass-card" style="max-width: 1200px; width: 95%; display: grid; grid-template-columns: 280px 1fr; gap: 2rem; text-align: left; align-items: start; padding: 2rem; margin: 8rem 0 4rem 0;">
        <!-- SIDEBAR (LEFT) -->
        <aside style="border-right: 1px solid var(--glass-border); padding-right: 2rem; height: 100%; display: flex; flex-direction: column; gap: 2rem;">
            <!-- Perfil do Corretor -->
            <div style="text-align: center; border-bottom: 1px solid var(--glass-border); padding-bottom: 1.5rem;">
                <div style="width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--primary); margin: 0 auto 1rem; display: flex; align-items: center; justify-content: center; background: rgba(0, 255, 136, 0.1); color: var(--primary); font-size: 1.5rem; font-weight: 800;">CJ</div>
                <h3 style="font-size: 1.1rem; color: #fff; margin-bottom: 0.2rem;">Corretor João</h3>
                <p style="font-size: 0.65rem; color: var(--primary); font-weight: 700; text-transform: uppercase;">Gestor de Vendas</p>
                <div style="margin-top: 0.8rem;">
                    <div id="statsCount" style="font-size: 1.2rem; font-weight: 800; color: #fff;">0</div>
                    <div style="font-size: 0.5rem; color: var(--text-dim); text-transform: uppercase;">Ações Realizadas</div>
                </div>
            </div>

            <!-- Histórico Lateral -->
            <div style="flex-grow: 1;">
                <h4 style="font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; margin-bottom: 1rem; letter-spacing: 1px;">Últimos Atendimentos</h4>
                <div id="historyList" style="display: flex; flex-direction: column; gap: 0.8rem; max-height: 250px; overflow-y: auto; padding-right: 0.5rem;"></div>
                
                <div style="margin-top: 1.5rem; display: flex; flex-direction: column; gap: 0.5rem;">
                    <button onclick="window.location.href='notes.html'" style="background: rgba(0, 255, 136, 0.1); color: var(--primary); border: 1px solid var(--primary); padding: 0.6rem; border-radius: 6px; cursor: pointer; font-size: 0.7rem; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">📝 Anotações de Clientes</button>
                    <button id="clearHistoryBtn" style="background: rgba(255, 68, 68, 0.05); color: #ff4444; border: 1px solid rgba(255, 68, 68, 0.1); padding: 0.5rem; border-radius: 6px; cursor: pointer; font-size: 0.65rem;">🗑 Limpar Histórico</button>
                </div>
            </div>

            <div>
                <button onclick="window.location.href='index.html'" style="background: transparent; color: var(--text-dim); border: none; cursor: pointer; text-decoration: underline; font-size: 0.75rem; opacity: 0.7;">Sair do Sistema</button>
            </div>
        </aside>

        <!-- MAIN CONTENT (RIGHT) -->
        <main style="display: flex; flex-direction: column; gap: 2rem;">
            <div>
                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.5rem; gap: 1rem;">
                    <div class="logo-container" style="margin-bottom: 0;">
                        <div class="logo-text">mundo</div>
                        <div class="logo-plus">+</div>
                    </div>

                    <div id="batchDropZone" style="display: flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0 1rem; height: 38px; border: 1.5px dashed var(--primary); border-radius: 8px; background: rgba(0, 255, 136, 0.05); color: var(--text-dim); font-size: 0.65rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease; text-transform: uppercase; white-space: nowrap;">
                        📂 Arraste CPFs (.txt/.csv) Aqui
                        <input type="file" id="batchFileInput" accept=".txt,.csv" style="display: none;">
                    </div>
                </div>
                <h2 class="neon-text" style="font-size: 1.8rem; color: #fff;">SISTEMA DE GESTÃO</h2>
                
                <div class="form-group" style="margin-top: 1.5rem;">
                    <label for="cpf">CPF do Cliente</label>
                    <div style="display: flex; gap: 1rem;">
                        <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" style="text-align: center; letter-spacing: 2px;">
                        <button id="consultBtn" class="btn" style="width: 180px;">Validar Perfil</button>
                    </div>
                </div>

                <div id="loading" class="loading-spinner"></div>
                
                <div id="results" class="results" style="margin-top: 1rem; padding: 2rem; border-radius: 20px;">
                    <div style="margin-bottom: 1.5rem;">
                        <h3 style="color: var(--primary); margin:0; font-size: 1.3rem; border-bottom: 1px solid var(--glass-border); padding-bottom: 0.5rem; text-transform: uppercase;">Resultado da Consulta</h3>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
                        <div style="background: rgba(255, 255, 255, 0.05); padding: 1rem; border-radius: 12px; border: 1px solid var(--glass-border);">
                            <h4 style="font-size: 0.65rem; color: var(--text-dim); margin-bottom: 0.4rem; text-transform: uppercase;">Nome Completo</h4>
                            <div id="clientName" style="font-size: 1.1rem; font-weight: 700; color: #fff;"></div>
                        </div>
                        <div style="background: rgba(255, 255, 255, 0.05); padding: 1rem; border-radius: 12px; border: 1px solid var(--glass-border);">
                            <h4 style="font-size: 0.65rem; color: var(--text-dim); margin-bottom: 0.4rem; text-transform: uppercase;">Data de Nascimento</h4>
                            <div id="clientBirthDate" style="font-size: 1.1rem; font-weight: 700; color: #fff;"></div>
                        </div>
                        <div id="restrictionCard" style="padding: 1rem; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1);">
                            <h4 style="font-size: 0.65rem; color: var(--text-dim); margin-bottom: 0.4rem; text-transform: uppercase;">Restrição no Nome</h4>
                            <div id="restrictionsList" style="font-size: 1.1rem; font-weight: 800; color: #fff;"></div>
                        </div>
                    </div>



                    <div style="background: rgba(255, 255, 255, 0.02); border: 1px solid var(--glass-border); padding: 1rem; border-radius: 12px;">
                        <h4 style="font-size: 0.7rem; color: var(--primary); margin-bottom: 0.8rem; text-transform: uppercase;">Anotações Atuais</h4>
                        <textarea id="notesArea" placeholder="Anote as observações sobre o cliente..." style="width: 100%; height: 80px; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); border-radius: 8px; color: #fff; padding: 0.8rem; font-size: 0.8rem; resize: none; margin-bottom: 0.8rem;"></textarea>
                        <button id="saveNotesBtn" style="width: 100%; background: var(--primary); color: #000; border: none; padding: 0.6rem; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.8rem;">Salvar Anotação e Sincronizar</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script src="script.js"></script>
</body>
</html>
